# ## Executive summary (read this first)
# Publish the isolated, frozen source context as an amd64 image. No team keys,
# input data, cached predictions or model weights are present in this repository.
name: Publish frozen scenario hybrid v2
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:scenario-hybrid-v2
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: echo "$IMAGE" | tee image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-reference.txt
